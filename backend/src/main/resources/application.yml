spring:
  application:
    name: catraca
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/qf_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
app:
  notifications:
    mail-enabled: ${SMTP_ENABLED:false}
  scheduling:
    zone-id: ${SCHEDULING_ZONE_ID:America/Sao_Paulo}
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:14}
    cookie-secure: ${COOKIE_SECURE:false}
    allowed-origin: ${ALLOWED_ORIGIN:http://localhost:4200}
  bootstrap:
    admin-email: ${INITIAL_ADMIN_EMAIL:}
    admin-password: ${INITIAL_ADMIN_PASSWORD:}
